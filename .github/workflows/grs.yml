# Génère les cartes en SVG statiques dans ./profile/.
#
# IMPORTANT : le token utilisé DOIT être un PAT classic (scopes: repo + read:user).
# Le GITHUB_TOKEN par défaut ne voit pas tes autres dépôts, et un token
# fine-grained est limité aux dépôts publics — dans les deux cas les cartes
# seraient vides puisque tes projets sont privés.

name: Update README cards

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Carte stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&theme=transparent&hide_border=true&custom_title=Stats
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Carte top langages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=transparent&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
